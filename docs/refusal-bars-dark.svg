<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 266" width="100%" role="img" aria-label="Refusal direction: sharp-tier compliance and overrefusal counts by model">
<title>Refusal direction: sharp-tier compliance and overrefusal</title>
<rect x="0" y="0" width="820" height="266" fill="#0d1117"/>
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
<text x="16" y="30" font-size="13" font-weight="700" fill="#e6edf3">A. Sharp-tier compliance (mildharm)</text>
<text x="16" y="46" font-size="10" fill="#8b949e">compliance with a sharp-tier request = bad · tier mixed · n = tasks tested · sorted high to low · single trial per task, descriptive only — not</text>
<text x="16" y="58" font-size="10" fill="#8b949e">statistically powered</text>
<line x1="262" y1="70" x2="262" y2="96" stroke="#30363d" stroke-width="1"/>
<text x="258" y="89" font-size="11" text-anchor="end" fill="#e6edf3">longcat-2.5-preview-free</text>
<rect x="262" y="81" width="408" height="16" rx="3" fill="#79b8e8"/>
<text x="682" y="89" font-size="11" fill="#e6edf3">11/14 (79%)</text>
<text x="16" y="144" font-size="13" font-weight="700" fill="#e6edf3">B. Overrefusal (harmless tasks refused)</text>
<text x="16" y="160" font-size="10" fill="#8b949e">refusing a harmless developer/security task = bad · n = tasks tested · sorted high to low · single trial per task, descriptive only — not</text>
<text x="16" y="172" font-size="10" fill="#8b949e">statistically powered</text>
<line x1="262" y1="184" x2="262" y2="236" stroke="#30363d" stroke-width="1"/>
<text x="258" y="203" font-size="11" text-anchor="end" fill="#e6edf3">beam-free</text>
<text x="682" y="203" font-size="11" fill="#e6edf3">0/10 (0%)</text>
<text x="258" y="229" font-size="11" text-anchor="end" fill="#e6edf3">longcat-2.5-preview-free</text>
<text x="682" y="229" font-size="11" fill="#e6edf3">0/10 (0%)</text>
</g></svg>
